[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://atlas.ileabinibi.com"
  # These public values legitimately appear in the built site; do not let Netlify's secret scanner fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VAPID_PUBLIC_KEY,SITE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/calendar/*"
  to = "/kojoda/"
  status = 301

[[redirects]]
  from = "/atlas/*"
  to = "/map/"
  status = 301

[[redirects]]
  from = "/login/*"
  to = "/account/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/account/#admin"
  status = 301

[[redirects]]
  from = "/*"

  to = "/404.html"
  status = 404
