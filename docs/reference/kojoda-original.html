<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>364 — Yoruba Calendar</title>
    <style>
        :root {
            --bg-deep: #07070a;
            --bg-surface: #0f0f1a;
            --bg-elevated: #16162b;
            --bg-card: #1f1f3a;
            --bg-hover: #2a2a4a;
            
            --text: #f0f0f5;
            --text-secondary: #b0b0d0;
            --text-muted: #707090;
            --text-dim: #505060;
            
            --border: rgba(255, 255, 255, 0.05);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            
            --radius: 0.625rem;
            --radius-lg: 1rem;
            
            --fest-ifa: #f59e0b;
            --fest-osun: #10b981;
            --fest-ogun: #64748b;
            --fest-sango: #ef4444;
            --fest-egungun: #d946ef;
            --fest-yam: #84cc16;
            --fest-oya: #a855f7;
            --fest-obatala: #e2e8f0;
            --fest-olokun: #3b82f6;
            --fest-oduduwa: #f97316;
            --fest-general: #eab308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        .app {
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .app-header {
            flex-shrink: 0;
            padding: 0.5rem 1rem 0.375rem;
            background: linear-gradient(180deg, rgba(15,15,26,0.98) 0%, rgba(15,15,26,0.9) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .brand-title {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 0.4rem;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 0.5rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 150ms;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 150ms;
            font-weight: 300;
        }

        .nav-btn:active {
            transform: scale(0.88);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .month-info {
            text-align: center;
            flex: 1;
            cursor: pointer;
            user-select: none;
            padding: 0.2rem;
        }

        .month-title {
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            background: linear-gradient(135deg, var(--text), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .month-meta {
            font-size: clamp(0.55rem, 2vw, 0.7rem);
            color: var(--accent-primary);
            font-weight: 700;
            margin-top: 0.05rem;
            letter-spacing: 0.05em;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.375rem;
            padding: 0.375rem 1rem;
            background: rgba(7,7,10,0.8);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            text-align: center;
            padding: 0.375rem 0.25rem;
            border-radius: 0.5rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            transition: all 150ms;
        }

        .stat:active {
            transform: scale(0.95);
            background: var(--bg-elevated);
        }

        .stat-value {
            font-size: clamp(0.85rem, 3vw, 1.1rem);
            font-weight: 800;
            color: var(--text);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: clamp(0.5rem, 1.5vw, 0.65rem);
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            margin-top: 0.1rem;
        }

        /* ===== LEGEND ===== */
        .legend-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.25rem 1rem;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .legend-bar::-webkit-scrollbar {
            display: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: clamp(0.5rem, 1.5vw, 0.65rem);
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ===== CALENDAR ===== */
        .calendar-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 0.75rem 0.375rem;
        }

        .weekday-row {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: clamp(1.5rem, 6vw, 2.25rem) repeat(4, 1fr);
            gap: 0.375rem;
            padding: 0.375rem 0;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .weekday {
            text-align: center;
            font-size: clamp(0.55rem, 1.8vw, 0.75rem);
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .calendar-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-height: 0;
            padding-top: 0.25rem;
        }

        .week-row {
            flex: 1;
            display: flex;
            gap: 0.375rem;
            min-height: 0;
        }

        .week-num {
            width: clamp(1.5rem, 6vw, 2.25rem);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.5rem, 1.5vw, 0.65rem);
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.05em;
            border-radius: 0.375rem;
            background: rgba(255,255,255,0.02);
        }

        .day-cell {
            flex: 1;
            min-width: 0;
            border-radius: clamp(0.375rem, 1.5vw, 0.75rem);
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 150ms;
            position: relative;
            border: 1.5px solid transparent;
            overflow: hidden;
            gap: 0.15rem;
        }

        .day-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 150ms;
        }

        .day-cell:active {
            transform: scale(0.93);
            border-color: rgba(255,255,255,0.1);
        }

        .day-cell:active::before {
            opacity: 0.25;
        }

        .day-cell.today {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 0 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.25);
            animation: pulse-soft 2.5s ease-in-out infinite;
        }

        .day-cell.today .day-number {
            color: white;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .day-cell.selected {
            border-color: var(--accent-primary);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 1px var(--accent-primary), 0 0 16px var(--accent-glow);
        }

        .day-cell.selected .day-number {
            color: var(--accent-primary);
            font-weight: 800;
        }

        .day-number {
            font-size: clamp(0.85rem, 3.5vw, 1.3rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1;
            z-index: 1;
            font-variant-numeric: tabular-nums;
        }

        .day-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-primary);
            box-shadow: 0 0 4px var(--accent-glow);
            z-index: 2;
        }

        .day-cell.today .day-indicator {
            background: white;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        .fest-indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            z-index: 2;
            flex-shrink: 0;
            box-shadow: 0 0 4px currentColor;
        }

        /* ===== FULL SCREEN DETAIL ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-screen {
            position: fixed;
            inset: 0;
            z-index: 110;
            background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-deep) 100%);
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .detail-screen.open {
            transform: translateY(0);
        }

        .detail-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .detail-title-group {
            flex: 1;
        }

        .detail-title {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            background: linear-gradient(135deg, var(--text), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detail-subtitle {
            font-size: clamp(0.65rem, 2.5vw, 0.9rem);
            color: var(--accent-primary);
            margin-top: 0.15rem;
            font-weight: 600;
        }

        .detail-close {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 150ms;
        }

        .detail-close:active {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            transform: scale(0.9);
        }

        .progress-area {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            gap: clamp(1.5rem, 6vw, 3rem);
            padding: 0.375rem 0;
        }

        .progress-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
        }

        .progress-ring {
            position: relative;
            width: clamp(55px, 16vw, 85px);
            height: clamp(55px, 16vw, 85px);
        }

        .progress-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--bg-card);
            stroke-width: 5;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 600ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.85rem, 3vw, 1.1rem);
            font-weight: 800;
            color: var(--text);
        }

        .progress-label {
            font-size: clamp(0.55rem, 1.8vw, 0.7rem);
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .detail-cards {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: 0.375rem;
            min-height: 0;
            margin-top: 0.25rem;
            overflow-y: auto;
        }

        .detail-cards::-webkit-scrollbar {
            display: none;
        }

        .info-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: all 150ms;
            gap: 0.875rem;
        }

        .info-card:active {
            transform: translateX(4px);
            background: var(--bg-elevated);
        }

        .info-icon {
            width: clamp(28px, 8vw, 40px);
            height: clamp(28px, 8vw, 40px);
            border-radius: 0.5rem;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            flex-shrink: 0;
        }

        .info-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .info-label {
            font-size: clamp(0.55rem, 1.8vw, 0.7rem);
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .info-value {
            font-size: clamp(0.8rem, 2.8vw, 1rem);
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-value.highlight {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fest-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            gap: 0.875rem;
            animation: slideIn 300ms ease-out;
        }

        .fest-card.ifa {
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.05));
            border-color: rgba(245,158,11,0.2);
        }

        .fest-card.osun {
            background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.05));
            border-color: rgba(16,185,129,0.2);
        }

        .fest-card.ogun {
            background: linear-gradient(135deg, rgba(100,116,139,0.1), rgba(100,116,139,0.05));
            border-color: rgba(100,116,139,0.2);
        }

        .fest-card.sango {
            background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.05));
            border-color: rgba(239,68,68,0.2);
        }

        .fest-card.egungun {
            background: linear-gradient(135deg, rgba(217,70,239,0.1), rgba(217,70,239,0.05));
            border-color: rgba(217,70,239,0.2);
        }

        .fest-card.yam {
            background: linear-gradient(135deg, rgba(132,204,22,0.1), rgba(132,204,22,0.05));
            border-color: rgba(132,204,22,0.2);
        }

        .fest-card.oya {
            background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(168,85,247,0.05));
            border-color: rgba(168,85,247,0.2);
        }

        .fest-card.obatala {
            background: linear-gradient(135deg, rgba(226,232,240,0.1), rgba(226,232,240,0.05));
            border-color: rgba(226,232,240,0.2);
        }

        .fest-card.olokun {
            background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(59,130,246,0.05));
            border-color: rgba(59,130,246,0.2);
        }

        .fest-card.oduduwa {
            background: linear-gradient(135deg, rgba(249,115,22,0.1), rgba(249,115,22,0.05));
            border-color: rgba(249,115,22,0.2);
        }

        .fest-icon {
            width: clamp(28px, 8vw, 40px);
            height: clamp(28px, 8vw, 40px);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            flex-shrink: 0;
        }

        .fest-card.ifa .fest-icon {
            background: rgba(245,158,11,0.15);
            color: var(--fest-ifa);
        }

        .fest-card.osun .fest-icon {
            background: rgba(16,185,129,0.15);
            color: var(--fest-osun);
        }

        .fest-card.ogun .fest-icon {
            background: rgba(100,116,139,0.15);
            color: var(--fest-ogun);
        }

        .fest-card.sango .fest-icon {
            background: rgba(239,68,68,0.15);
            color: var(--fest-sango);
        }

        .fest-card.egungun .fest-icon {
            background: rgba(217,70,239,0.15);
            color: var(--fest-egungun);
        }

        .fest-card.yam .fest-icon {
            background: rgba(132,204,22,0.15);
            color: var(--fest-yam);
        }

        .fest-card.oya .fest-icon {
            background: rgba(168,85,247,0.15);
            color: var(--fest-oya);
        }

        .fest-card.obatala .fest-icon {
            background: rgba(226,232,240,0.15);
            color: var(--fest-obatala);
        }

        .fest-card.olokun .fest-icon {
            background: rgba(59,130,246,0.15);
            color: var(--fest-olokun);
        }

        .fest-card.oduduwa .fest-icon {
            background: rgba(249,115,22,0.15);
            color: var(--fest-oduduwa);
        }

        .fest-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .fest-name {
            font-size: clamp(0.8rem, 2.8vw, 1rem);
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fest-desc {
            font-size: clamp(0.55rem, 1.8vw, 0.75rem);
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        /* ===== MONTH PICKER ===== */
        .picker-screen {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-deep) 100%);
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .picker-screen.open {
            transform: translateY(0);
        }

        .picker-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .picker-title {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 800;
        }

        .picker-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 0.5rem;
            min-height: 0;
        }

        .month-option {
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 150ms;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .month-option::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 150ms;
        }

        .month-option:active {
            transform: scale(0.95);
        }

        .month-option:active::before {
            opacity: 0.3;
        }

            z-index: 200;

            font-weight: 600;
            white-space: nowrap;
        }

        function formatGregorian(date) {
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            return `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()}`;
        }

        function getDayOfYear(m, d) { return m * CONFIG.daysPerMonth + d; }
        function getWeekOfYear(d) { return Math.floor(d / CONFIG.daysPerWeek) + 1; }
        function getDayOfWeek(d) { return (d % CONFIG.daysPerWeek) + 1; }
        function getWeekOfMonth(d) { return Math.floor((d % CONFIG.daysPerMonth) / CONFIG.daysPerWeek) + 1; }

        function applyTheme(i) {
            const t = THEMES[i];
            const r = document.documentElement;
            r.style.setProperty('--accent-primary', t.primary);
            r.style.setProperty('--accent-secondary', t.secondary);
            r.style.setProperty('--accent-glow', t.glow);
            r.style.setProperty('--accent-glow-2', t.glow2);
        }

        function getFestival(doy) {
            return FESTIVALS[doy] || null;
        }

        function renderCalendar(animateClass) {
            applyTheme(currentMonth);
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const start = currentMonth * CONFIG.daysPerMonth;
            
            for (let w = 0; w < CONFIG.weeksPerMonth; w++) {
                const row = document.createElement('div');
                row.className = `week-row ${animateClass || ''}`;
                
                const wn = document.createElement('div');
                wn.className = 'week-num';
                wn.textContent = getWeekOfYear(start + w * CONFIG.daysPerWeek);
                row.appendChild(wn);
                
                for (let d = 0; d < CONFIG.daysPerWeek; d++) {
                    const dim = w * CONFIG.daysPerWeek + d;
                    const doy = start + dim;
                    
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    if (doy === todayDayOfYear) cell.classList.add('today');
                    if (selectedDay === doy) cell.classList.add('selected');
                    
                    const fest = getFestival(doy);
                    
                    if (d === 0 && doy !== todayDayOfYear && !fest) {
                        const ind = document.createElement('div');
                        ind.className = 'day-indicator';
                        cell.appendChild(ind);
                    }
                    
                    const num = document.createElement('div');
                    num.className = 'day-number';
                    num.textContent = dim + 1;
                    cell.appendChild(num);
                    
                    if (fest) {
                        const fi = document.createElement('div');
                        fi.className = 'fest-indicator';
                        fi.style.background = TYPE_COLORS[fest.type];
                        fi.style.color = TYPE_COLORS[fest.type];
                        cell.appendChild(fi);
                    }
                    
                    cell.onclick = () => openDetail(doy);
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            }
            
            document.getElementById('monthTitle').textContent = `Month ${currentMonth + 1}`;
            document.getElementById('monthMeta').textContent = `${THEMES[currentMonth].yoruba} • ${THEMES[currentMonth].season}`;
            updateStats(start);
        }

        function updateStats(doy) {
            document.getElementById('statDay').textContent = doy + 1;
            document.getElementById('statWeek').textContent = getWeekOfYear(doy);
            document.getElementById('statWeekDay').textContent = getDayOfWeek(doy);
            document.getElementById('statQuarter').textContent = QUARTERS[currentMonth];
        }

        function openDetail(doy) {
            selectedDay = doy;
            renderCalendar();
            
            const mi = Math.floor(doy / CONFIG.daysPerMonth);
            const dim = (doy % CONFIG.daysPerMonth) + 1;
            const wm = getWeekOfMonth(doy);
            const dw = getDayOfWeek(doy);
            const wy = getWeekOfYear(doy);
            const t = THEMES[mi];
            const fest = getFestival(doy);
            const gregDate = getGregorianDate(doy);
            
            const yp = ((doy + 1) / 364 * 100).toFixed(1);
            const mp = ((dim / 28) * 100).toFixed(1);
            
            document.getElementById('detailTitle').textContent = `Day ${doy + 1}`;
            document.getElementById('detailSubtitle').textContent = `${t.yoruba} (Month ${mi + 1}), Week ${wm}`;
            
            setTimeout(() => {
                const c = 2 * Math.PI * 35;
                document.getElementById('yearRing').style.strokeDasharray = c;
                document.getElementById('yearRing').style.strokeDashoffset = c * (1 - parseFloat(yp) / 100);
                document.getElementById('monthRing').style.strokeDasharray = c;
                document.getElementById('monthRing').style.strokeDashoffset = c * (1 - parseFloat(mp) / 100);
                document.getElementById('yearPercent').textContent = `${yp}%`;
                document.getElementById('monthPercent').textContent = `${mp}%`;
            }, 100);
            
            let cardsHtml = '';
            
            if (fest) {
                cardsHtml += `
                    <div class="fest-card ${fest.type}">
                        <div class="fest-icon">${fest.icon}</div>
                        <div class="fest-text">
                            <div class="fest-name">${fest.name}</div>
                            <div class="fest-desc">${fest.desc}</div>
                        </div>
                    </div>
                `;
            }
            
            cardsHtml += `
                <div class="info-card">
                    <div class="info-icon">◈</div>
                    <div class="info-text">
                        <div class="info-label">Calendar Position</div>
                        <div class="info-value highlight">${t.yoruba}, Day ${dim}</div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">◎</div>
                    <div class="info-text">
                        <div class="info-label">Structure</div>
                        <div class="info-value">Day ${dw} of 4 • Week ${wm} of 7</div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">◉</div>
                    <div class="info-text">
                        <div class="info-label">Annual Cycle</div>
                        <div class="info-value">Week ${wy} of 91 • ${t.season}</div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">✦</div>
                    <div class="info-text">
                        <div class="info-label">Gregorian Anchor</div>
                        <div class="info-value highlight">${formatGregorian(gregDate)}</div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">◐</div>
                    <div class="info-text">
                        <div class="info-label">Year Completion</div>
                        <div class="info-value">${doy + 1} of 364 days</div>
                    </div>
                </div>
            `;
            
            document.getElementById('detailCards').innerHTML = cardsHtml;
            document.getElementById('detailScreen').classList.add('open');
            document.getElementById('overlay').classList.add('active');
            updateStats(doy);
        }

        function closeDetail() {
            document.getElementById('detailScreen').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
            selectedDay = null;
            setTimeout(() => renderCalendar(), 300);
        }

        function prevMonth() {
            if (isAnimating) return;
            isAnimating = true;
            currentMonth = (currentMonth - 1 + 13) % 13;
            renderCalendar('animate-slide-left');
            setTimeout(() => isAnimating = false, 350);
        }

        function nextMonth() {
            if (isAnimating) return;
            isAnimating = true;
            currentMonth = (currentMonth + 1) % 13;
            renderCalendar();
            setTimeout(() => isAnimating = false, 350);
        }

        function goToToday() {
            todayDayOfYear = getTodayDayOfYear();
            currentMonth = Math.floor(todayDayOfYear / CONFIG.daysPerMonth);
            renderCalendar();
            showToast('Odun Tuntun — Yoruba New Year');
        }

        function openPicker() {
            const g = document.getElementById('pickerGrid');
            g.innerHTML = '';
            for (let i = 0; i < 13; i++) {
                const o = document.createElement('div');
                o.className = `month-option ${i === currentMonth ? 'active' : ''}`;
                o.innerHTML = `<div class="month-option-name">M${i + 1}</div><div class="month-option-season">${THEMES[i].yoruba}</div>`;
                o.onclick = () => { currentMonth = i; closePicker(); renderCalendar(); };
                g.appendChild(o);
            }
            document.getElementById('pickerScreen').classList.add('open');
        }

        function closePicker() {
            document.getElementById('pickerScreen').classList.remove('open');
        }

        let toastT;
        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toastText').textContent = m;
            t.classList.add('show');
            clearTimeout(toastT);
            toastT = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Swipe
        let tsX = 0, tsY = 0, teX = 0, swiping = false;
        document.addEventListener('touchstart', e => {
            tsX = e.changedTouches[0].screenX;
            tsY = e.changedTouches[0].screenY;
            swiping = false;
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            const x = e.changedTouches[0].screenX, y = e.changedTouches[0].screenY;
            if (Math.abs(x - tsX) > Math.abs(y - tsY) && Math.abs(x - tsX) > 10) swiping = true;
        }, { passive: true });
        document.addEventListener('touchend', e => {
            if (!swiping) return;
            teX = e.changedTouches[0].screenX;
            if (teX < tsX - 50) nextMonth();
            else if (teX > tsX + 50) prevMonth();
        }, { passive: true });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') prevMonth();
            if (e.key === 'ArrowRight') nextMonth();
            if (e.key === 'Escape') { closeDetail(); closePicker(); }
            if (e.key === 't' || e.key === 'T') goToToday();
        });

        renderCalendar();
    </script>
</body>
</html>
